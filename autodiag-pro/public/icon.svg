<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#0e7490"/>
    </linearGradient>
    <linearGradient id="icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa"/>
      <stop offset="100%" style="stop-color:#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Gear/wrench icon simplified -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="url(#icon)" stroke-width="20"/>
  <circle cx="256" cy="256" r="55" fill="url(#icon)"/>
  <!-- Gear teeth -->
  <rect x="236" y="96" width="40" height="60" rx="8" fill="url(#icon)"/>
  <rect x="236" y="356" width="40" height="60" rx="8" fill="url(#icon)"/>
  <rect x="96" y="236" width="60" height="40" rx="8" fill="url(#icon)"/>
  <rect x="356" y="236" width="60" height="40" rx="8" fill="url(#icon)"/>
  <!-- Diagonal teeth -->
  <rect x="148" y="130" width="40" height="60" rx="8" fill="url(#icon)" transform="rotate(45 168 160)"/>
  <rect x="324" y="322" width="40" height="60" rx="8" fill="url(#icon)" transform="rotate(45 344 352)"/>
  <rect x="148" y="322" width="40" height="60" rx="8" fill="url(#icon)" transform="rotate(-45 168 352)"/>
  <rect x="324" y="130" width="40" height="60" rx="8" fill="url(#icon)" transform="rotate(-45 344 160)"/>
  <!-- OBD connector hint at bottom -->
  <rect x="196" y="390" width="120" height="36" rx="8" fill="rgba(255,255,255,0.15)"/>
  <rect x="210" y="400" width="16" height="16" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="232" y="400" width="16" height="16" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="254" y="400" width="16" height="16" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="276" y="400" width="16" height="16" rx="3" fill="rgba(255,255,255,0.6)"/>
  <rect x="298" y="400" width="16" height="16" rx="3" fill="rgba(255,255,255,0.6)"/>
</svg>