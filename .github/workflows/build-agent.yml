name: Build AutoDiagAgent.exe

on:
  push:
    branches: [main]
    paths:
      - 'autodiag-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar .exe en Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar node-gyp / MSVC
        run: |
          npm config set msvs_version 2022
          npm config set python python
          npm install -g node-gyp
          npm install -g pkg@5.8.1

      # Instalar TODAS las deps en autodiag-agent
      # serialport y ffi-napi compilan nativos con MSVC 2022
      - name: npm install completo
        working-directory: autodiag-agent
        env:
          npm_config_msvs_version: '2022'
          GYP_MSVS_VERSION: '2022'
        run: npm install

      # Estrategia: pkg empaqueta el JS, los .node nativos van en carpeta aparte
      # El ZIP final contiene: AutoDiagAgent.exe + node_modules/ (solo los .node)
      - name: Build exe con pkg
        working-directory: autodiag-agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # pkg - empaquetar solo el JS, los nativos se cargan desde disco
          pkg agent-lite.js `
            --targets node18-win-x64 `
            --output dist/AutoDiagAgent.exe `
            --no-bytecode `
            --public-packages "*" `
            --public

          if (Test-Path "dist/AutoDiagAgent.exe") {
            $mb = [math]::Round((Get-Item "dist/AutoDiagAgent.exe").Length/1MB,1)
            Write-Host "exe OK: $mb MB"
          } else {
            Write-Host "exe FALLO - listando errores"
            exit 1
          }

      # ZIP: exe + los binarios nativos necesarios (.node files)
      - name: Empaquetar ZIP con nativos
        shell: pwsh
        run: |
          $src  = "autodiag-agent"
          $dist = "$src/dist"
          $tmp  = "$dist/release"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null

          # exe principal
          Copy-Item "$dist/AutoDiagAgent.exe" "$tmp/"

          # Copiar .node nativos que el exe necesita en runtime
          # Estructura que espera pkg: junto al exe o en subcarpeta
          $nativeDir = "$tmp/node_modules"
          New-Item -ItemType Directory -Force -Path $nativeDir | Out-Null

          # serialport bindings
          $spBinding = "$src/node_modules/@serialport/bindings-cpp/prebuilds/win32-x64"
          if (Test-Path $spBinding) {
            $dst = "$nativeDir/@serialport/bindings-cpp/prebuilds/win32-x64"
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item "$spBinding/*.node" $dst/ -ErrorAction SilentlyContinue
          }
          # Buscar cualquier .node de serialport
          Get-ChildItem "$src/node_modules" -Recurse -Filter "*.node" | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path "$src/node_modules").Path.Length + 1)
            $dstFile = "$nativeDir/$rel"
            New-Item -ItemType Directory -Force -Path (Split-Path $dstFile) | Out-Null
            Copy-Item $_.FullName $dstFile -Force
            Write-Host "Nativo: $rel"
          }

          if (Test-Path "$src/LEEME.txt") { Copy-Item "$src/LEEME.txt" "$tmp/" }

          # Crear ZIP
          $zipPath = "autodiag-pro/public/AutoDiagAgent.zip"
          Compress-Archive -Path "$tmp/*" -DestinationPath $zipPath -Force
          $mb = [math]::Round((Get-Item $zipPath).Length/1MB,1)
          Write-Host "ZIP final: $mb MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagAgent-release
          path: autodiag-agent/dist/release/
          retention-days: 30

      - name: Commit ZIP a repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "autodiag-pro/public/AutoDiagAgent.zip"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "ci: AutoDiagAgent actualizado [skip ci]"
            git push
            Write-Host "Pusheado OK"
          } else {
            Write-Host "Sin cambios en ZIP"
          }
