name: Build AutoDiagAgent.exe

on:
  push:
    branches: [main]
    paths:
      - 'autodiag-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar .exe en Windows (x86 para DLL 32-bit)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      # Node 18 x86 (32-bit) — necesario para cargar RKW_VNCI_PT32.dll que es 32-bit
      - name: Setup Node.js 18 x86 (32-bit)
        shell: pwsh
        run: |
          # Descargar Node 18 x86
          $nodeVersion = "18.20.4"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x86.zip"
          Write-Host "Descargando Node $nodeVersion x86..."
          Invoke-WebRequest -Uri $url -OutFile "node-x86.zip"
          Expand-Archive -Path "node-x86.zip" -DestinationPath "C:\node-x86" -Force
          $nodePath = "C:\node-x86\node-v$nodeVersion-win-x86"
          Write-Host "Node x86 en: $nodePath"
          # Agregar al PATH de este job
          echo "$nodePath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          # Verificar
          & "$nodePath\node.exe" --version
          & "$nodePath\node.exe" -e "console.log(process.arch)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configurar node-gyp para x86
        shell: pwsh
        run: |
          npm config set msvs_version 2022
          npm config set python python
          npm install -g node-gyp
          npm install -g pkg@5.8.1

      - name: Instalar dependencias x86
        working-directory: autodiag-agent
        shell: pwsh
        env:
          npm_config_msvs_version: '2022'
          npm_config_arch: 'ia32'
          npm_config_target_arch: 'ia32'
        run: |
          # Instalar todo para x86 (ia32)
          npm install ws
          
          # koffi - tiene prebuilds win32-ia32
          npm install koffi --arch=ia32
          
          # serialport - forzar x86
          npm install serialport --arch=ia32
          
          Write-Host "=== Deps instaladas ==="
          npm list --depth=0

      - name: Build exe x86
        working-directory: autodiag-agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          
          # pkg target: node18-win-x86 (32-bit)
          pkg agent-lite.js `
            --targets node18-win-x86 `
            --output dist/AutoDiagAgent.exe `
            --no-bytecode `
            --public-packages "*" `
            --public
          
          if (Test-Path "dist/AutoDiagAgent.exe") {
            $mb = [math]::Round((Get-Item "dist/AutoDiagAgent.exe").Length/1MB,1)
            Write-Host "exe x86 OK: $mb MB"
          } else {
            Write-Host "FALLO: no se genero el exe"
            exit 1
          }

      - name: Empaquetar ZIP (exe + nativos x86)
        shell: pwsh
        run: |
          $src = "autodiag-agent"
          $tmp = "$src/dist/release"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item "$src/dist/AutoDiagAgent.exe" "$tmp/"
          if (Test-Path "$src/LEEME.txt") { Copy-Item "$src/LEEME.txt" "$tmp/" }

          # Copiar .node nativos x86
          $nmSrc = "$src/node_modules"
          $nmDst = "$tmp/node_modules"
          New-Item -ItemType Directory -Force -Path $nmDst | Out-Null
          Get-ChildItem $nmSrc -Recurse -Filter "*.node" | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $nmSrc).Path.Length + 1)
            $dst = "$nmDst/$rel"
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $_.FullName $dst -Force
            Write-Host "  nativo x86: $rel"
          }

          $zip = "autodiag-pro/public/AutoDiagAgent.zip"
          Compress-Archive -Path "$tmp/*" -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length/1MB,1)
          Write-Host "ZIP: $mb MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagAgent-x86
          path: autodiag-agent/dist/release/
          retention-days: 30

      - name: Commit ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "autodiag-pro/public/AutoDiagAgent.zip"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "ci: AutoDiagAgent.exe x86 actualizado [skip ci]"
            git push
          } else { Write-Host "Sin cambios" }
