name: Build AutoDiagAgent.exe

on:
  push:
    branches: [main]
    paths:
      - 'autodiag-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Empaquetar agente portable x86
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Descargar Node 18 x86 portable
        shell: pwsh
        run: |
          $ver = "18.20.4"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x86.zip"
          Invoke-WebRequest -Uri $url -OutFile "node-x86.zip" -UseBasicParsing
          Expand-Archive -Path "node-x86.zip" -DestinationPath "node-x86-tmp" -Force
          Rename-Item "node-x86-tmp\node-v$ver-win-x86" "node" -Force
          & "node-x86-tmp\node\node.exe" --version
          & "node-x86-tmp\node\node.exe" -e "console.log('arch:', process.arch)"

      - name: Instalar dependencias con Node x86
        shell: pwsh
        env:
          npm_config_msvs_version: '2022'
          npm_config_arch: 'ia32'
          npm_config_target_arch: 'ia32'
        run: |
          $nodeExe = (Resolve-Path "node-x86-tmp\node\node.exe").Path
          $npmJs   = (Resolve-Path "node-x86-tmp\node\node_modules\npm\bin\npm-cli.js").Path
          Set-Location autodiag-agent

          # ws - puro JS, sin nativos
          & $nodeExe $npmJs install ws
          Write-Host "ws OK"

          # koffi - tiene prebuilds win32-ia32, no compila
          & $nodeExe $npmJs install koffi
          Write-Host "koffi OK"

          # serialport - instalar SIN scripts (no compila), solo el JS
          # Los bindings nativos no son necesarios: el agente los carga en runtime
          # Si no hay prebuild, el agente cae a "sin serial" y usa solo J2534
          & $nodeExe $npmJs install serialport --ignore-scripts
          Write-Host "serialport OK (sin compilar)"

          Write-Host "=== node_modules ==="
          Get-ChildItem node_modules -Directory | Select-Object Name

      - name: Empaquetar release portable
        shell: pwsh
        run: |
          $rel = "release-tmp"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null

          Copy-Item "node-x86-tmp\node\node.exe" "$rel\"
          Copy-Item "autodiag-agent\agent-lite.js" "$rel\"
          Copy-Item "autodiag-agent\package.json"  "$rel\"
          if (Test-Path "autodiag-agent\LEEME.txt") { Copy-Item "autodiag-agent\LEEME.txt" "$rel\" }
          Copy-Item "autodiag-agent\node_modules" "$rel\node_modules" -Recurse

          # Escribir el .bat sin heredoc (evita problemas YAML)
          $bat = "@echo off`r`n"
          $bat += "title AutoDiag Pro - Agente J2534`r`n"
          $bat += "cd /d `"%~dp0`"`r`n"
          $bat += "echo.`r`n"
          $bat += "echo  AutoDiag Pro - Agente v4.2`r`n"
          $bat += "echo  Iniciando...`r`n"
          $bat += "echo.`r`n"
          $bat += "node.exe agent-lite.js`r`n"
          $bat += "pause`r`n"
          [System.IO.File]::WriteAllText("$rel\AutoDiagAgent.bat", $bat, [System.Text.Encoding]::ASCII)

          $zip = "autodiag-pro\public\AutoDiagAgent.zip"
          Compress-Archive -Path "$rel\*" -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "ZIP: $mb MB"
          Get-ChildItem $rel | Select-Object Name

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagAgent-portable
          path: release-tmp/
          retention-days: 30

      - name: Commit ZIP a main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "autodiag-pro/public/AutoDiagAgent.zip"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "ci: AutoDiagAgent portable x86 actualizado [skip ci]"
            git push
          } else { Write-Host "Sin cambios" }
