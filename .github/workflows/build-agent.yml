name: Build AutoDiagAgent.exe

on:
  push:
    branches: [main]
    paths:
      - 'autodiag-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar .exe en Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # ffi-napi necesita compilar módulos nativos — requiere Python + MSVC
      - name: Setup Python (para node-gyp)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Visual C++ Build Tools
        run: |
          npm install --global windows-build-tools --vs2019 2>$null || true
          npm install --global node-gyp

      - name: Instalar dependencias del agente
        working-directory: autodiag-agent
        run: |
          npm install --build-from-source
        env:
          npm_config_build_from_source: true

      - name: Instalar pkg
        run: npm install --global pkg

      # pkg no soporta ffi-napi nativo dentro del .exe
      # Usamos nexe que sí empaqueta addons nativos correctamente
      - name: Instalar nexe
        run: npm install --global nexe@4.0.0-rc.6

      - name: Compilar con nexe
        working-directory: autodiag-agent
        run: |
          mkdir -p dist
          nexe agent-lite.js --target windows-x64-18.20.4 --output dist/AutoDiagAgent-nexe.exe --verbose 2>&1 || true

      # Fallback: pkg con snapshot de node_modules
      - name: Compilar con pkg (fallback)
        working-directory: autodiag-agent
        run: |
          pkg agent-lite.js --targets node18-win-x64 --output dist/AutoDiagAgent.exe --no-bytecode --public-packages "*" 2>&1 || true

      # Si pkg falla por ffi-napi, creamos el agente sin ffi (solo serial)
      - name: Compilar versión sin ffi-napi (serial only)
        working-directory: autodiag-agent
        run: |
          node -e "
            const fs = require('fs');
            let code = fs.readFileSync('agent-lite.js', 'utf8');
            // Marca el build como 'sin DLL nativa'
            code = code.replace(
              'const VERSION     = \'3.0.0\'',
              'const VERSION     = \'3.0.1-serial\''
            );
            fs.writeFileSync('agent-lite-noffi.js', code);
          "
          pkg agent-lite-noffi.js --targets node18-win-x64 --output dist/AutoDiagAgent-serial.exe --no-bytecode --public-packages "*" 2>&1 || echo "pkg build done"

      - name: Listar archivos generados
        working-directory: autodiag-agent
        run: dir dist 2>nul || echo "No se generaron archivos en dist/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagAgent-Windows
          path: |
            autodiag-agent/dist/*.exe
          retention-days: 30

      # Si el .exe se generó, empaquetarlo en ZIP y copiarlo al public de Railway
      - name: Empaquetar en ZIP para Railway
        shell: pwsh
        run: |
          $distPath = "autodiag-agent/dist"
          $zipPath  = "autodiag-pro/public/AutoDiagAgent.zip"
          
          # Elegir el mejor .exe disponible
          $exeFiles = @(
            "$distPath/AutoDiagAgent.exe",
            "$distPath/AutoDiagAgent-nexe.exe",
            "$distPath/AutoDiagAgent-serial.exe"
          )
          
          $best = $null
          foreach ($f in $exeFiles) {
            if (Test-Path $f) { $best = $f; break }
          }
          
          if ($best) {
            Write-Host "Empaquetando $best en $zipPath"
            
            # Crear ZIP con .exe + README
            $tmpDir = "autodiag-agent/dist/zip_tmp"
            New-Item -ItemType Directory -Force -Path $tmpDir | Out-Null
            Copy-Item $best "$tmpDir/AutoDiagAgent.exe"
            Copy-Item "autodiag-agent/LEEME.txt" "$tmpDir/" 2>$null || true
            
            Compress-Archive -Path "$tmpDir/*" -DestinationPath $zipPath -Force
            Write-Host "ZIP generado: $zipPath"
            
            # Verificar
            $zip = Get-Item $zipPath
            Write-Host "Tamaño ZIP: $([math]::Round($zip.Length / 1MB, 2)) MB"
          } else {
            Write-Host "WARNING: No se encontró .exe para empaquetar"
          }

      - name: Commit ZIP actualizado a main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add autodiag-pro/public/AutoDiagAgent.zip || true
          git diff --cached --quiet && echo "Sin cambios en ZIP" || git commit -m "ci: actualiza AutoDiagAgent.zip [skip ci]"
          git push || echo "Push fallido (sin cambios)"
