name: Build AutoDiagAgent.exe

on:
  push:
    branches: [main]
    paths:
      - 'autodiag-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Empaquetar agente portable x86
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Descargar Node 18 x86 portable (no instalar, solo el zip)
      - name: Descargar Node 18 x86 portable
        shell: pwsh
        run: |
          $ver = "18.20.4"
          $url = "https://nodejs.org/dist/v$ver/node-v$ver-win-x86.zip"
          Write-Host "Descargando Node $ver x86 portable..."
          Invoke-WebRequest -Uri $url -OutFile "node-x86.zip" -UseBasicParsing
          Expand-Archive -Path "node-x86.zip" -DestinationPath "node-x86-tmp" -Force
          # Renombrar carpeta a nombre fijo
          Rename-Item "node-x86-tmp\node-v$ver-win-x86" "node-x86-tmp\node" -Force
          Write-Host "Node x86 OK"
          & "node-x86-tmp\node\node.exe" --version
          & "node-x86-tmp\node\node.exe" -e "console.log('arch:', process.arch)"

      # Instalar deps con Node x86
      - name: Instalar dependencias con Node x86
        shell: pwsh
        env:
          npm_config_msvs_version: '2022'
          npm_config_arch: 'ia32'
          npm_config_target_arch: 'ia32'
        run: |
          $node  = (Resolve-Path "node-x86-tmp\node\node.exe").Path
          $npm   = (Resolve-Path "node-x86-tmp\node\npm.cmd").Path
          
          Set-Location autodiag-agent
          
          # Instalar solo las deps necesarias para runtime
          & $node $npm.Replace(".cmd","") install ws --prefer-offline 2>&1
          & $node $npm.Replace(".cmd","") install koffi --arch=ia32 2>&1
          & $node $npm.Replace(".cmd","") install serialport --arch=ia32 2>&1
          
          Write-Host "=== node_modules instalados ==="
          Get-ChildItem node_modules -Directory | Select-Object Name

      # Empaquetar: carpeta con node.exe x86 + agent-lite.js + node_modules
      - name: Empaquetar release portable
        shell: pwsh
        run: |
          $release = "release-tmp"
          New-Item -ItemType Directory -Force -Path $release | Out-Null

          # node.exe x86
          Copy-Item "node-x86-tmp\node\node.exe" "$release\"
          
          # archivos del agente
          Copy-Item "autodiag-agent\agent-lite.js"   "$release\"
          Copy-Item "autodiag-agent\package.json"    "$release\"
          if (Test-Path "autodiag-agent\LEEME.txt") { Copy-Item "autodiag-agent\LEEME.txt" "$release\" }

          # node_modules completo
          Copy-Item "autodiag-agent\node_modules" "$release\node_modules" -Recurse

          # Lanzador .bat — doble click ejecuta el agente
          @'
@echo off
title AutoDiag Pro - Agente J2534
cd /d "%~dp0"
echo.
echo  +==========================================+
echo  ^|  AUTODIAG PRO - Agente v4.2              ^|
echo  ^|  Iniciando...                             ^|
echo  +==========================================+
echo.
node.exe agent-lite.js
pause
'@ | Out-File -FilePath "$release\AutoDiagAgent.bat" -Encoding ascii

          # Crear ZIP final
          $zip = "autodiag-pro\public\AutoDiagAgent.zip"
          Compress-Archive -Path "$release\*" -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Host "ZIP generado: $mb MB"
          Write-Host "Contenido:"
          Get-ChildItem $release | Select-Object Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagAgent-portable
          path: release-tmp/
          retention-days: 30

      - name: Commit ZIP a main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "autodiag-pro/public/AutoDiagAgent.zip"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "ci: AutoDiagAgent portable x86 actualizado [skip ci]"
            git push
          } else { Write-Host "Sin cambios en ZIP" }
