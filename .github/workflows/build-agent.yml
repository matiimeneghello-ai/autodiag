name: Build AutoDiagAgent.exe

on:
  push:
    branches: [main]
    paths:
      - 'autodiag-agent/**'
      - '.github/workflows/build-agent.yml'
  workflow_dispatch:

jobs:
  build-windows:
    name: Compilar .exe en Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18.20.4'

      # ffi-napi tiene prebuilds para win32-x64 en npm
      # Hay que instalarlo SIN compilar y bajar el prebuild
      - name: Instalar dependencias (prebuilds, sin compilar)
        working-directory: autodiag-agent
        shell: pwsh
        run: |
          # ws - puro JS, sin nativos
          npm install ws

          # serialport - bajar prebuild win32-x64 sin compilar
          npm install serialport --ignore-scripts
          # Forzar descarga del prebuild correcto
          node -e "
            const { execSync } = require('child_process');
            try {
              execSync('node node_modules/@serialport/bindings-cpp/node_modules/.bin/node-pre-gyp install --fallback-to-build=false', { stdio: 'inherit' });
            } catch(e) {
              console.log('prebuild-install directo...');
              execSync('node node_modules/prebuild-install/bin.js --runtime napi --target 18 --platform win32 --arch x64', { stdio: 'inherit', cwd: 'node_modules/@serialport/bindings-cpp' });
            }
          " || echo "serialport prebuild: intentando alternativa"
          npm install @serialport/bindings-cpp --ignore-scripts

          # ffi-napi - usar version con prebuild disponible para win32
          # koffi es el reemplazo moderno de ffi-napi con prebuilds
          npm install koffi

          # ref-napi solo para tipado (no se usa en runtime del agente)
          npm install ref-napi ref-struct-napi --ignore-scripts

          Write-Host "Deps instaladas"
          npm list --depth=0

      - name: Instalar pkg
        run: npm install -g pkg@5.8.1

      - name: Build exe
        working-directory: autodiag-agent
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          pkg agent-lite.js `
            --targets node18-win-x64 `
            --output dist/AutoDiagAgent.exe `
            --no-bytecode `
            --public-packages "*" `
            --public
          if (Test-Path "dist/AutoDiagAgent.exe") {
            $mb = [math]::Round((Get-Item "dist/AutoDiagAgent.exe").Length/1MB,1)
            Write-Host "exe OK: $mb MB"
          } else { exit 1 }

      - name: Empaquetar ZIP (exe + nativos)
        shell: pwsh
        run: |
          $src = "autodiag-agent"
          $tmp = "$src/dist/release"
          New-Item -ItemType Directory -Force -Path $tmp | Out-Null
          Copy-Item "$src/dist/AutoDiagAgent.exe" "$tmp/"
          if (Test-Path "$src/LEEME.txt") { Copy-Item "$src/LEEME.txt" "$tmp/" }

          # Copiar todos los .node nativos al lado del exe
          $nmSrc = "$src/node_modules"
          $nmDst = "$tmp/node_modules"
          New-Item -ItemType Directory -Force -Path $nmDst | Out-Null
          Get-ChildItem $nmSrc -Recurse -Filter "*.node" | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $nmSrc).Path.Length + 1)
            $dst = "$nmDst/$rel"
            New-Item -ItemType Directory -Force -Path (Split-Path $dst) | Out-Null
            Copy-Item $_.FullName $dst -Force
            Write-Host "  nativo: $rel"
          }

          $zip = "autodiag-pro/public/AutoDiagAgent.zip"
          Compress-Archive -Path "$tmp/*" -DestinationPath $zip -Force
          $mb = [math]::Round((Get-Item $zip).Length/1MB,1)
          Write-Host "ZIP: $mb MB -> $zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoDiagAgent-release
          path: autodiag-agent/dist/release/
          retention-days: 30

      - name: Commit ZIP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "autodiag-pro/public/AutoDiagAgent.zip"
          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "ci: AutoDiagAgent.exe actualizado [skip ci]"
            git push
          } else { Write-Host "Sin cambios" }
